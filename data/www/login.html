<!DOCTYPE html>
<!-- login.html - deliberately generic: could be any appliance's admin portal.
     No product name, no hints. -->
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%230f0f0f'/%3E%3Cpath d='M13 2 4.5 13.5H11L9.5 22 19.5 9.5H12.5L13 2Z' fill='%2300e676'/%3E%3C/svg%3E">
<title>Sign in</title>
<link rel="stylesheet" href="/style.css?v=60">
</head><body class="login-body">
<div class="login-card">
  <div style="text-align:center;margin-bottom:18px">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
      style="color:var(--muted)">
      <rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="12" cy="15" r="1.6" fill="currentColor"/>
    </svg>
  </div>
  <h2>Sign in</h2>
  <p class="muted">Enter your credentials to continue.</p>
  <form id="f">
    <label>Username<input name="user" autocomplete="username" required></label>
    <label>Password<input type="password" name="pass" autocomplete="current-password" required></label>
    <button type="submit" class="primary" style="width:100%">Continue</button>
  </form>
  <p id="err" class="err" style="font-size:13px"></p>
</div>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch('/api/login', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({user: fd.get('user'), pass: fd.get('pass')})});
  if (r.ok) location.href = '/';
  else document.getElementById('err').textContent = 'Incorrect username or password.';
};
</script></body></html>
