; ============================================================================
; ProjectCodename - Advanced Pentest / BadUSB tool for LILYGO T-Dongle-S3
; ----------------------------------------------------------------------------
; Board : ESP32-S3, 16MB Quad-SPI flash, 512KB SRAM, NO PSRAM
; LCD   : ST7735 (SPI)      LED : APA102-2020 (2-wire SPI)   BTN : BOOT (GPIO0)
;
; NOTE: We use the pioarduino fork because stock PlatformIO espressif32 is
;       frozen at arduino-esp32 2.0.17. Do NOT switch back to `espressif32`.
; ============================================================================

[platformio]
src_dir = src
data_dir = data          ; `pio run -t uploadfs` flashes this as LittleFS
default_envs = t-dongle-s3
boards_dir = boards

[env:t-dongle-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = dongles3

; --- USB -------------------------------------------------------------------
; ARDUINO_USB_MODE=0 selects the TinyUSB stack -> required for USB HID
; (keyboard/mouse = BadUSB). Hardware CDC would block HID.
board_build.arduino.usb_mode = 0
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0        ; CDC off: TinyUSB stack owned by the HID keyboard (calling USB.begin() twice crashes the device)
    -DCORE_DEBUG_LEVEL=1
    -Wl,-zmuldefs                      ; raw 802.11 injection: our no-op ieee80211_raw_frame_sanity_check must override libnet80211.a's (brute32 technique)
    ; Project-wide pin map lives in include/pins.h
    ;-DDUCKY_DEBUG=1                   ; uncomment for verbose script tracing

lib_deps =
    bblanchon/ArduinoJson@^7           ; settings + API payloads
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10
    adafruit/Adafruit GFX Library@^1.11
    https://github.com/pololu/apa102-arduino.git#3.0.0                 ; proven dotstar driver (same as USBArmyKnife)

monitor_speed = 115200
upload_speed = 921600

; LittleFS: used for the web UI assets. SD card (SD_MMC, 4-bit) holds user
; files/scripts/logs and is formatted at runtime if needed.
board_build.filesystem = littlefs
